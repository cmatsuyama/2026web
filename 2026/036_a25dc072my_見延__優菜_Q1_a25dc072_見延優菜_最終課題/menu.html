<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smile Dog Cafe - MENU</title>
    <link rel="icon" href="images/logo.png" type="image/png">

    <!-- リセットCSS & メインCSS -->
    <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ヘッダー -->
    <header class="page-header">
        <h1 style="margin:0;">
            <a href="index.html"><img class="logo" src="images/logo.png" alt="Smile Dog Cafe"></a>
        </h1>
        <nav>
            <ul class="main-nav">
                <li><a href="news.html">News</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- 看板画像 -->
    <div class="sub-cover menu">
        <h2 class="page-title">Menu</h2>
    </div>

    <!-- メニュー一覧（全8項目） -->
    <main class="wrapper">
        <section>
            <h3 class="heading-medium">Menu List</h3>
            <div class="menu-grid">
                
                <!-- 1 -->
                <div class="menu-card">
                    <img src="images/menu5.jpg" alt="ブレンドコーヒー">
                    <h4>ブレンドコーヒー</h4>
                    <div class="price">¥500</div>
                </div>

                <!-- 2 -->
                <div class="menu-card">
                    <img src="images/menu7.jpg" alt="自家製サンドイッチ">
                    <h4>自家製サンドイッチ</h4>
                    <div class="price">¥850</div>
                </div>

                <!-- 3 -->
                <div class="menu-card">
                    <img src="images/menu2.jpg" alt="季節のヘルシープレート">
                    <h4>季節のパスタセット</h4>
                    <div class="price">¥1,200</div>
                </div>

                <!-- 4 -->
                <div class="menu-card">
                    <img src="images/menu8.jpg" alt="自家製いちごタルト">
                    <h4>自家製いちごタルト</h4>
                    <div class="price">¥650</div>
                </div>

                <!-- 5 -->
                <div class="menu-card">
                    <img src="images/menu9.jpg" alt="濃厚チョコブラウニー">
                    <h4>濃厚チョコブラウニー</h4>
                    <div class="price">¥550</div>
                </div>

                <!-- 6（追加） -->
                <div class="menu-card">
                    <img src="images/menu1.jpg" alt="自家製パンケーキ">
                    <h4>【犬専用】自家製パンケーキ</h4>
                    <div class="price">¥700</div>
                </div>

                <!-- 7（追加） -->
                <div class="menu-card">
                    <img src="images/menu3.jpg" alt="手作りクッキー">
                    <h4>【犬専用】手作り骨がたクッキー</h4>
                    <div class="price">¥400</div>
                </div>

                <!-- 8（追加） -->
                <div class="menu-card">
                    <img src="images/menu10.jpg" alt="わんこ特別フルーツプレート">
                    <h4>わんこ特別フルーツプレート</h4>
                    <div class="price">¥800</div>
                </div>

            </div>
        </section>
    </main>

    <footer class="page-footer">
        <table class="info">
            <tr><th>住所</th><td>東京都港区六本木0-0 ○○○</td></tr>
            <tr><th>電話</th><td>03-1111-xxxx</td></tr>
            <tr><th>営業時間</th><td>10:00 ~ 20:00</td></tr>
            <tr><th>店休日</th><td>水曜</td></tr>
        </table>
        <div class="copyright">
            <small>&copy;Smile Cafe A25DC072 見延優菜</small>
        </div>
    </footer>
