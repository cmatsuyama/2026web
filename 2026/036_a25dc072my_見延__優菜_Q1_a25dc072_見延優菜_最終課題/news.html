<!DOCTYPE html>
<html lang="ja">
<head>

    <title>Smile Dog Cafe - NEWS</title>
    <link rel="icon" href="images/logo.png" type="image/png">

    <!-- リセットCSS & メインCSS -->
    <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ヘッダー -->
    <header class="page-header">
        <h1 style="margin:0;">
            <a href="index.html"><img class="logo" src="images/logo.png" alt="Smile Dog Cafe"></a>
        </h1>
        <nav>
            <ul class="main-nav">
                <li><a href="news.html">News</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- 看板画像 -->
    <div class="sub-cover news">
        <h2 class="page-title">News</h2>
    </div>

    <!-- メインコンテンツ（左：記事 / 右：広告） -->
    <main class="wrapper news-layout">
        
        <!-- 左側：メイン記事 -->
        <div class="news-main">
            <article class="article-card">
                <div class="article-date">2026.09.28</div>
                <h3 class="article-title">ワンちゃん撮影会＆新作おやつ試食会を開催します！</h3>
                <p style="margin-bottom: 1.5rem; line-height: 1.8;">
                    いつもSmile Dog Cafeをご利用いただきありがとうございます！<br>
                    来月、プロのカメラマンをお招きして「ワンちゃん秋の撮影会」を開催いたします。あわせて秋限定の新作わんこスイーツの試食会も実施しますので、ぜひ愛犬と一緒にご参加ください！
                </p>
                
                <!-- 写真 -->
                <div class="article-image">
                    <img src="images/outside.jpg" alt="撮影会イメージ">
                </div>
            </article>
        </div>

        <!-- 右側：広告バナー -->
        <aside class="news-sidebar">
            <div class="ad-card">
                <p class="ad-label">SPECIAL BANNER</p>
                <a href="menu.html">
                    <img src="images/banner.jpg" alt="おすすめバナー広告">
                </a>
            </div>
        </aside>

    </main>

    <!-- フッター -->
    <footer class="page-footer">
        <table class="info">
            <tr><th>住所</th><td>東京都港区六本木0-0 ○○○</td></tr>
            <tr><th>電話</th><td>03-1111-xxxx</td></tr>
            <tr><th>営業時間</th><td>10:00 ~ 20:00</td></tr>
            <tr><th>店休日</th><td>水曜</td></tr>
        </table>
        <div class="copyright">
            <small>&copy;Smile Cafe A25DC072 見延優菜</small>
        </div>
    </footer>
