<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafe Aporia</title>
    <meta name="description" content="渋谷のカフェ＆バー">
    <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Philosopher:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

<body>
    <header class="page-header wrapper">
        <div class="header-inner">
        <a href="index.html" class="site-logo">
            <img src="images/fav.jpg" alt="Cafe Aporia">
        </a>
        <nav>
            <ul class="main-nav font-english">
                <li><a href="index.html">Home</a></li>
                <li><a href="news.html">News</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
        </div>
    </header>
    <main>
        <section class="about">
            <div class="about-inner wrapper">
                <div class="about-photo">
                    <img src="images/menu-image.jpg" alt="店内の様子">
                </div>
                <div class="about-body">
                    <h1 class="heading-large">Aporia</h1>
                    <p>
                        Aporiaは渋谷の隠れたカフェバーです。<br>
                        寛ぎの時間と丁寧なサービスを提供いたします。
                    </p>
                </div>
            </div>
        </section>
        <section class="news-section cafe-cover">
            <h3 class="emphasis font-english">Cafe Menu</h3>
            <div class=" wrapper grid">
                <div class="item">
                <img src="images/basil-minced-pork-with-rice-fried-egg.jpg" alt="">
                <p>ガパオライス</p>
                </div>
                <div class="item">
                <img src="images/da08479581968d2308da7b3df64abe22.jpg" alt="">
                <p>クラブハウスサンド</p>
                </div>
                <div class="item">
                <img src="images/pasta.jpg" alt="">
                <p>日替わりパスタ</p>
                </div>
                <div class="item">
                <img src="images/pancake.jpg" alt="">
                <p>季節のパンケーキ</p>
                </div>
                <div class="item">
                <img src="images/captino.jpg" alt="">
                <p>カプチーノ</p>
                </div>
                <div class="item small">
                <img src="images/IMG_1104.JPG" alt="">
                <p>ココア</p>
                </div>
            </div>
        </section>
    </main>
    <section class="bar-cover">
        <h3 class="emphasis font-english">Bar Menu</h3>
        <div class=" content-wrapper grid">
                <div class="item">
                <img src="images/dmitry-dreyer-7hHRTw_-1SY-unsplash.jpg" alt="">
                <p>ウォッカベース</p>
                </div>
                <div class="item">
                <img src="images/adam-jaime-dmkmrNptMpw-unsplash.jpg" alt="">
                <p>ラムベース</p>
                </div>
                <div class="item">
                <img src="images/ash-edmonds-fsI-_MRsic0-unsplash.jpg" alt="">
                <p>ウィスキーベース</p>
                </div>
                <div class="item">
                <img src="images/svitlana-aOBR-RXR6PA-unsplash.jpg" alt="">
                <p>ワインベース</p>
                </div>
                <div class="item">
                <img src="images/m-s-meeuwesen-QYWYnzvPTAQ-unsplash.jpg" alt="">
                <p>リキュールベース</p>
                </div>
                <div class="item">
                <img src="images/edward-howell-jNs7IPdt4HQ-unsplash.jpg" alt="">
                <p>ノンアルコール</p>
                </div>

            <div class="align-center message">
            <p>メニュー表にないものでも可能な限り承ります。<br>
