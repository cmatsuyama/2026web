<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WARNING!!</title>
    <style>
        body {
            background-color: #000080; /* 昔のブルースクリーン風 */
            color: #ffffff;
            font-family: 'MS Gothic', 'ＭＳ ゴシック', monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .error-box {
            border: 2px solid #ffffff;
            padding: 20px;
            background-color: #000000;
            max-width: 400px;
        }
        h1 { color: #ff0000; font-size: 1.5rem; }
        a { color: #ffff00; text-decoration: none; font-weight: bold; }

<body>

    <div class="error-box">
        <h1>⚠️ SYSTEM ERROR ⚠️</h1>
        <p>重大なエラーが発生しました（嘘）</p>
        <p>驚かせてすみません！</p>
        <br>
        <a href="#" onclick="history.back(); return false;">[ 安全に元のページに戻る ]</a>
    </div>

    <script>
        // ページが開いた時に3回だけポップアップを出す
        window.onload = function() {
            alert("⚠️ 警告：システムが侵害されました！");
            alert("⚠️ データを消去中... (1/3)");
            alert("…というのは嘘！びっくりした？");
        };

</html>
