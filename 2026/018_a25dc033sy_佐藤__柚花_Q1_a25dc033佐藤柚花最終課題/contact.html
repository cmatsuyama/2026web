<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>† Black Dream Garden † - CONTACT</title>
    <link rel="icon" href="images/favicon.jpg" type="image/jpeg">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<section class="container">
    <h1>† CONTACT & REQUEST †</h1>

    <div class="gallery-intro">
        <p>イラストのご依頼、お仕事の相談、その他のお問い合わせはこちらからどうぞ。</p>
        <p>※返信には数日お時間をいただく場合があります。ご了承ください。</p>
    </div>

    <div class="navi">
        <a href="index.html">【TOPに戻る】</a>
    </div>

    <!-- 送信用フォームエリア -->
    <div class="form-container">
        <!-- 実際に機能させる場合は action に送信先のURLなどを設定します -->
        <form action="#" method="POST">

            <div class="form-group">
                <label for="name">お名前（ハンドルネーム可） <span class="required">※</span></label>
                <input type="text" id="name" name="name" placeholder="例：博麗 霊夢" required>
            </div>

            <div class="form-group">
                <label for="email">メールアドレス <span class="required">※</span></label>
                <input type="email" id="email" name="email" placeholder="例：your-mail@example.com" required>
            </div>

            <div class="form-group">
                <label for="subject">件名（ご用件）</label>
                <select id="subject" name="subject">
                    <option value="request">イラストのご依頼について</option>
                    <option value="question">サイトへのご質問</option>
                    <option value="other">その他のお問い合わせ</option>
                </select>
            </div>

            <div class="form-group">
                <label for="message">メッセージ内容 <span class="required">※</span></label>
                <textarea id="message" name="message" rows="8" placeholder="ご自由にご記入ください。依頼の場合はサイズや納期なども書いていただけるとスムーズです。" required></textarea>
            </div>

            <div class="form-submit">
                <button type="submit" class="submit-btn">† 送信する †</button>
            </div>

        </form>
    </div>

    <!-- 戻るリンク -->
    <div class="gallery-back">
        <a href="index.html">戻る</a>
    </div>

</section>

<footer>
    Copyright © a25dc033 佐藤柚花 All Rights Reserved.
</footer>
<script src="js/script.js"></script></body> 
</body>
</html>
