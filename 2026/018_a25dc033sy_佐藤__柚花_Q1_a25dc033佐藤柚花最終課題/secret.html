<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>† 秘密の部屋 †</title>
    <style>
        /* 背景が0.08秒ごとにネオンカラーで高速点滅 */
        @keyframes strobe {
            0%   { background-color: #ff00ff; }
            25%  { background-color: #00ffff; }
            50%  { background-color: #ffff00; }
            75%  { background-color: #39ff14; }
            100% { background-color: #ff0055; }
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            animation: strobe 0.08s infinite; /* 高速点滅 */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'MS Gothic', 'ＭＳ ゴシック', sans-serif;
            overflow: hidden;
        }

        /* 画面中央のメッセージボックス */
        .warning-box {
            background-color: #000000;
            color: #39ff14;
            border: 4px dashed #ff00ff;
            padding: 30px;
            text-align: center;
            box-shadow: 0 0 20px #000000;
            max-width: 80%;
        }

        h1 {
            font-size: 2.5rem;
            color: #ff00ff;
            text-shadow: 3px 3px #00ffff;
            margin-bottom: 20px;
        }

        p {
            font-size: 1.2rem;
            line-height: 1.8;
            color: #ffffff;
        }

        /* 戻るボタン */
        .back-btn {
            display: inline-block;
            margin-top: 30px;
            padding: 10px 20px;
            background-color: #ff0055;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            border: 2px solid #ffffff;
        }

        .back-btn:hover {
            background-color: #ffffff;
            color: #000000;
        }
    </style>
</head>
<body>

    <div class="warning-box">
        <h1>† 見つけてくれてありがとう †</h1>
        <p>ここまでたどり着くなんて……<br>あなたの目は無事ですか？</p>
        <p style="color: #ffff00; font-size: 0.9rem;">※長時間の閲覧は精神に異常をきたす恐れがあります。</p>

        <div class="gallery-back">
            <a href="index.html">戻る</a>
        </div>
    </div>

</body>
</html>
