<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level 0 - The Backrooms</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: #baa867;
            background-image:
                linear-gradient(rgba(0, 0, 0, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 0, 0, 0.1) 1px, transparent 1px);
            background-size: 20px 20px;
            color: #2b2510;
            font-family: 'MS Gothic', 'ＭＳ ゴシック', monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
            animation: flicker 4s infinite;
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.95; }
            52% { opacity: 0.4; }
            54% { opacity: 0.95; }
            80% { opacity: 1; }
            82% { opacity: 0.2; }
            83% { opacity: 0.9; }
        }

        /* 空間の薄暗いノイズ感 */
        .container {
            background-color: rgba(220, 200, 130, 0.85);
            border: 2px solid #554a23;
            padding: 40px;
            max-width: 500px;
            box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.3), 0 10px 20px rgba(0, 0, 0, 0.4);
        }

        h1 {
            font-size: 1.8rem;
            letter-spacing: 4px;
            margin-bottom: 20px;
            border-bottom: 1px dashed #554a23;
            padding-bottom: 10px;
        }

        p {
            font-size: 0.95rem;
            line-height: 1.8;
            text-align: left;
        }

        /* 戻るボタン */
        .back-link {
            display: inline-block;
            margin-top: 30px;
            color: #554a23;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            border: 1px solid #554a23;
            padding: 8px 16px;
            background-color: #c9b775;
        }

        .back-link:hover {
            background-color: #554a23;
            color: #baa867;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>LEVEL 0</h1>
        <p>どこかで現実の壁をすり抜けてしまったようだ。</p>
        <p>周りには湿ったカーペットの匂いと、モノトーンの黄色い壁紙、そして頭上で鳴り響く蛍光灯のブーンという不快なノイズだけが存在している……。</p>

    </div>

</body>
</html>
