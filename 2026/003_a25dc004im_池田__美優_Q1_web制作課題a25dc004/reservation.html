<head>
    <meta charset="UTF-8">

    <!--Google font読み込み-->

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bona+Nova+SC:ital,wght@0,400;0,700;1,400&family=Klee+One&family=Philosopher:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <!--CSS読み込み-->
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="images/favicon.jpeg">
    <!-- OGP -->
    <meta property="og:url" content="http://example.com/index.html">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Galaxy Tour Contact">
    <meta property="og:description" content="民間宇宙旅行のGalaxy Tours。地球軌道周回から月面着陸まで、一生に一度の体験をお届けします。">
    <meta property="og:image" content="http://example.com/images/ogp.jpg">

</head>

<body>
    <div class="sub-cover cover-contact">
        <header class="page-header wrapper">
            <h1 class="text-logo"><a href="index.html">Galaxy Tours</a></h1>
            <nav>
                <ul class="main-nav">
                    <li><a href="plan.html">Plan</a></li>
                    <li><a href="news.html">News</a></li>
                    <li><a href="reservation.html">Reservation</a></li>
                </ul>
            </nav>
        </header>

        <div class="wrapper">
            <h2 class="page-title">Reservation</h2>
            <p>搭乗に関するご予約、事前カウンセリングのお申し込みはこちらからお願いいたします。</p>
        </div>
    </div>

    <div class="contact-info wrapper">
        <p>宇宙旅行は、事前のメディカルチェックおよび適性検査を通過された方のみご案内しております。<br>
        まずは担当のフライトコンシェルジュによる無料カウンセリングにお申し込みください。</p>

        <form action="#">
            <div>
                <label for="name">お名前</label>
                <input type="text" id="name" name="your-name" placeholder="例：宇宙 太郎">
            </div>

            <div>
                <label for="email">メールアドレス</label>
                <input type="email" id="email" name="your-email" placeholder="例：flight@example.com">
            </div>

            <div>
                <label for="message">ご希望のプラン・ご質問など</label>
                <textarea id="message" name="your-message" placeholder="例：Orbital Cruiseを検討しています。事前訓練の日程について詳しく知りたいです。"></textarea>
            </div>

            <input type="submit" class="button" value="カウンセリングを予約する">
        </form>
    </div>

    <footer class="page-footer">
        <h3 class="heading-large font-english">Information</h3>
        <table class="info">
            <tr>
                <th>住所</th>
                <td>東京都港区六本木0-0 〇〇〇</td>
            </tr>
            <tr>
                <th>電話</th>
                <td>03-111-XXXXX</td>
            </tr>
            <tr>
                <th>営業時間</th>
                <td>10:00～20:00</td>
            </tr>
            <tr>
                <th>店休日</th>
                <td>水曜日</td>
            </tr>
        </table>
        <div class="copyright">
            <small>&copy;Galaxy Tours 池田美優</small>
        </div>
        </footer>
</body>

</html>
