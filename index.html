<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web制作 クラス作品集</title>
    <style>
        /* 全体の設定 */
        body {
            font-family: "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        header {
            text-align: center;
            padding: 40px 0;
        }
        h1 { margin: 0 0 10px 0; color: #333; }
        header p { margin: 0; color: #666; }

        /* グリッドレイアウト */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* カードのデザイン */
        .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.08);
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        .card a {
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        /* iframeコンテナ（プレビューエリア） */
        .iframe-container {
            width: 100%;
            height: 200px; /* プレビューの高さを指定 */
            overflow: hidden;
            position: relative;
            background-color: #eee; /* 読み込み前の背景色 */
            /* 【追加】中身を中央に寄せる設定 */
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        /* iframe本体を縮小して表示 */
        .iframe-container iframe {
            width: 1200px; /* 元のサイトを想定した幅 */
            height: 800px; /* 元のサイトを想定した高さ */
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            
            /* 【重要】縮小（スケール）の設定 */
            transform: scale(0.32); /* 280px幅に収まるよう約1/4に縮小 */
            transform-origin: top left; /* 左上を起点に縮小 */
            
            /* 読み込み前のちらつき防止 */
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        
        /* 読み込み完了後に表示 */
        .iframe-container iframe.loaded {
            opacity: 1;
        }

        /* テキストエリア */
        .info {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .info h2 {
            font-size: 1.1rem;
            margin: 0 0 8px 0;
            color: #007aff;
            /* 長いタイトルを省略する設定 */
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .info .theme {
            font-size: 0.85rem;
            color: #666;
            margin: 0 0 10px 0;
            flex-grow: 1;
        }
        .info .meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: #999;
            border-top: 1px solid #eee;
            padding-top: 10px;
        }
        .info .student-id {
            background: #f0f0f0;
            padding: 2px 6px;
            border-radius: 4px;
            color: #555;
        }
    </style>
</head>
<body>

    <header>
        <h1>Web制作 クラス作品集</h1>
        <p>学生たちが制作したWebサイトのプレビュー一覧です。</p>
    </header>

    <main>
        <div id="student-list" class="grid-container"></div>
    </main>

    <script>
    const listContainer = document.getElementById('student-list');

    // 生成した data.json を読み込む
    fetch('data.json')
        .then(response => response.json())
        .then(students => {
            students.forEach(student => {
                const card = document.createElement('div');
                card.className = 'card';

                card.innerHTML = `
                    <a href="${student.path}" target="_blank">
                        <div class="iframe-container">
                            <iframe data-src="${student.path}" title="${student.title}" scrolling="no"></iframe>
                        </div>
                        <div class="info">
                            <h2>${student.title}</h2>
                            <div class="meta">
                                <span class="student-id">${student.id}</span>
                                <span>全画面表示 ↗</span>
                            </div>
                        </div>
                    </a>
                `;
                listContainer.appendChild(card);
            });

            // 遅延読み込み (Lazy Load) の有効化
            initLazyLoad();
        })
        .catch(error => console.error('JSON読み込みエラー:', error));

    function initLazyLoad() {
        const iframes = document.querySelectorAll('iframe[data-src]');
        const observer = new IntersectionObserver((entries, self) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const iframe = entry.target;
                    iframe.src = iframe.getAttribute('data-src');
                    iframe.removeAttribute('data-src');
                    iframe.onload = () => iframe.classList.add('loaded');
                    self.unobserve(iframe);
                }
            });
        }, { rootMargin: '200px 0px' });

        iframes.forEach(iframe => observer.observe(iframe));
    }
</script>
</body>
</html>
